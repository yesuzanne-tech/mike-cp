/* Mission CP : une page, un seul écran à la fois, gros boutons pour iPad. Texte très lisible, lecture à voix haute. */
:root {
  --ciel: #e9f5ff;

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--ciel); color: var(--encre); font-family: var(--police); font-size: 22px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
.bandeau { background: linear-gradient(to right, #2f6fd6, #34b3e6); border-bottom: 8px solid var(--orange); color: #fff; padding: 14px 20px; }
.bandeau-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.titre { font-size: 28px; font-weight: bold; margin: 0; }
main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px 16px; }
.carte { background: var(--papier); border: 3px solid var(--orange); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.carte.express { background: #fff6e5; border-color: #f08a1c; }
.carte.quiz { background: #eaf3ff; border-color: var(--bleu); }
h2 { font-size: 27px; margin: 0 0 8px 0; }
p { margin: 0 0 12px 0; }
.bouton { display: block; width: 100%; font-family: var(--police); font-size: 25px; font-weight: bold; padding: 18px; margin: 12px 0 0 0; border-radius: 10px; cursor: pointer; border: 3px solid var(--bleu-fonce); background: var(--bleu); color: #fff; text-align: center; -webkit-appearance: none; appearance: none; }
.bouton.second { background: #fff; color: var(--bleu-fonce); }
.bouton.orange { background: #f08a1c; border-color: #b8650a; }
.bouton:focus, .option:focus, .petit-bouton:focus { outline: 4px solid var(--or); outline-offset: 2px; }
.option { display: block; width: 100%; text-align: left; font-family: var(--police); font-size: 26px; padding: 18px; margin: 12px 0 0 0; border-radius: 10px; cursor: pointer; border: 3px solid var(--orange); background: #fffaf2; color: var(--encre); -webkit-appearance: none; appearance: none; }
.option.juste { background: #d8f0da; border-color: var(--juste); }
.option.faux { background: #f8dcd8; border-color: var(--faux); }
.option[disabled] { opacity: 1; cursor: default; }
.option.pris { background: #e3ecff; border-color: var(--bleu); color: #7a8aa5; }
.grand-emoji { font-size: 64px; line-height: 1.2; text-align: center; margin: 4px 0 8px 0; }
.question { font-size: 29px; font-weight: bold; line-height: 1.4; margin: 6px 0 4px 0; }
.suivi { font-size: 18px; color: #4a5d78; margin-bottom: 6px; }
.retour { margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 23px; }
.retour.ok { background: #d8f0da; border: 3px solid var(--juste); }
.retour.ko { background: #f8dcd8; border: 3px solid var(--faux); }
.etoiles { font-size: 52px; color: var(--or); letter-spacing: 6px; text-align: center; }
.note { font-size: 62px; font-weight: bold; color: var(--bleu-fonce); line-height: 1.1; text-align: center; margin: 4px 0 8px 0; }
.petit { font-size: 18px; color: #4a5d78; }
.pastille { display: inline-block; font-size: 17px; font-weight: bold; padding: 2px 12px; border-radius: 14px; background: var(--or); color: var(--encre); }
.barre { height: 16px; background: #dfe9f5; border-radius: 8px; overflow: hidden; margin-top: 4px; }
.barre i { display: block; height: 100%; background: var(--bleu); }
.petit-bouton { font-family: var(--police); font-size: 18px; font-weight: bold; padding: 8px 14px; border-radius: 8px; border: 3px solid #fff; background: transparent; color: #fff; cursor: pointer; -webkit-appearance: none; appearance: none; }
.lecon-txt { font-size: 25px; line-height: 1.7; background: #f4f9ff; border-left: 8px solid var(--bleu); padding: 14px 16px; border-radius: 6px; margin: 10px 0 0 0; }
.lecon-txt ul { margin: 0; padding-left: 26px; }
.lecon-txt li { margin: 8px 0; }
.lire { background: #f6f6f6; border-left-color: #a0a8b5; font-size: 21px; }
.rang { margin: 14px 0; }
.reponse-ordre { min-height: 70px; background: #f4f9ff; border: 3px dashed var(--bleu); border-radius: 10px; padding: 8px 12px; font-size: 22px; margin-top: 10px; }
.reponse-ordre div { margin: 4px 0; }
.bilan { width: 100%; font-family: "Courier New", monospace; font-size: 15px; min-height: 260px; padding: 12px; border: 3px solid var(--orange); border-radius: 8px; }
.lien-voix { font-family: var(--police); font-size: 20px; font-weight: bold; color: var(--bleu-fonce); background: #fff; border: 3px solid var(--bleu); border-radius: 14px; padding: 10px 18px; min-height: 48px; cursor: pointer; -webkit-appearance: none; appearance: none; }

.duo { display: flex; gap: 10px; }

.ecoute { display: inline-block; font-family: var(--police); font-size: 22px; font-weight: bold; padding: 10px 16px; margin: 6px 0; border-radius: 10px; border: 3px solid var(--bleu-fonce); background: #fff; color: var(--bleu-fonce); cursor: pointer; -webkit-appearance: none; appearance: none; }

  bind("b-stop", function () { stopVoix(); cur.ctx.retour(); });
  if (q.t === "ordre") {
    for (i = 0; i < q.items.length; i++) { (function (n) { bind("o" + n, function () { choisirOrdre(n); }); })(i); }
    bind("b-efface", function () { if (cur.figee) { return; } showQuestionOrdreReset(); });
  } else {
    for (i = 0; i < q.o.length; i++) { (function (n) { bind("o" + n, function () { repondre(n); }); })(i); }
  }
  if (state.auto) { parler(texteQuestion(q)); }
}
function showQuestionOrdreReset() {
  var q = cur.qs[cur.qi], i;
  cur.sel = [];
  for (i = 0; i < q.items.length; i++) { var b = document.getElementById("o" + i); if (b) { b.disabled = false; b.className = "option"; } }
  document.getElementById("rep-ordre").innerHTML = '<span class="petit">Ta réponse apparaît ici.</span>';
}
function termineQuestion(juste, texteJuste) {
  var q = cur.qs[cur.qi];
  cur.figee = true;
  noteReponse(q.lid, juste);
  if (juste) { cur.ok++; } else { cur.ratees.push(q); }
  persistEnc(cur.qi + 1);
  var last = (cur.qi >= cur.qs.length - 1);
  var m = '<div class="retour ' + (juste ? "ok" : "ko") + '"><p><b>' + (juste ? "Bravo ! 🎉" : "Pas grave, on apprend ! 💪") + '</b></p><p>' + esc(texteJuste) + '</p>';
  m += '<button class="ecoute" id="b-ecoute2">🔊 Écouter</button></div>';
  m += '<button class="bouton" id="b-next">' + (last ? "Voir mon résultat" : "Question suivante") + '</button>';
  document.getElementById("retour").innerHTML = m;
  bind("b-ecoute2", function () { parler((juste ? "Bravo ! " : "Pas grave. ") + texteJuste); });
  bind("b-next", function () { stopVoix(); cur.qi++; if (cur.qi >= cur.qs.length) { showFin(); } else { showQuestion(); } });
  if (state.auto) { parler((juste ? "Bravo ! " : "Pas grave. ") + texteJuste); }
  saveState();
}
function repondre(i) {
  if (cur.figee) { return; }
  var q = cur.qs[cur.qi], j;
  for (j = 0; j < q.o.length; j++) {
    var b = document.getElementById("o" + j);
    b.disabled = true;
    if (j === q.a) { b.className = "option juste"; }
    else if (j === i) { b.className = "option faux"; }
  }
  termineQuestion(i === q.a, (i === q.a ? "" : "La bonne réponse : " + (q.o[q.a]).replace(/^[🟢🟡🟠] /, "") + ". ") + q.why);
}
function choisirOrdre(n) {
  if (cur.figee) { return; }
  var q = cur.qs[cur.qi], i;
  cur.sel.push(n);
  var b = document.getElementById("o" + n);
  b.disabled = true; b.className = "option pris";
  var r = "";
  for (i = 0; i < cur.sel.length; i++) { r += '<div><b>' + (i + 1) + '.</b> ' + esc(q.items[cur.sel[i]]) + '</div>'; }
  document.getElementById("rep-ordre").innerHTML = r;
  if (cur.sel.length === q.items.length) {
    var juste = true;
    for (i = 0; i < cur.sel.length; i++) { if (cur.sel[i] !== i) { juste = false; } }
    var txt = juste ? q.why : "Le bon ordre : " + q.items.join(", puis ") + ".";
    var bt = document.getElementById("b-efface"); if (bt) { bt.style.display = "none"; }
    termineQuestion(juste, txt);
  }
}
function showFin() {
  var n = cur.qs.length, ok = cur.ok, et = nbEtoiles(ok, n), i, s = "";
  for (i = 0; i < 3; i++) { s += (i < et ? "★" : "☆"); }
  state.history.push({ d: isoToday(), k: cur.kind, g: cur.label, s: Math.round(ok / n * 10), ok: ok, n: n });
  if (state.history.length > 300) { state.history = state.history.slice(state.history.length - 300); }
  if (cur.kind === "quiz") {
    var qz = state.quiz, auj = isoToday();
    if (qz.last !== auj) { qz.streak = (qz.last === isoHier()) ? qz.streak + 1 : 1; qz.total++; qz.last = auj; }
  }
  state.enc = null;
  saveState();
  var msg = et === 3 ? "Excellent, Mike ! Tu connais très bien ta leçon." : (et === 2 ? "Très bien ! Encore un petit effort et ce sera parfait." : "Courage ! Relis ta leçon et recommence, tu vas y arriver.");
  var h = '<div class="carte"><div class="etoiles">' + s + '</div><div class="note">' + ok + ' / ' + n + '</div><p style="text-align:center"><b>' + msg + '</b></p>';
  if (cur.ratees.length) {
    h += '<p><b>À revoir :</b></p><div class="lecon-txt"><ul>';
    for (i = 0; i < cur.ratees.length; i++) { h += '<li>' + esc(cur.ratees[i].q) + '<br><span class="petit">' + esc(cur.ratees[i].why) + '</span></li>'; }
    h += '</ul></div>';
  }
  h += '<button class="bouton second" id="b-ret">Retour</button>';
  h += '<button class="bouton second" id="b-acc">Accueil</button></div>';
  go(h);
  var c = cur;
  bind("b-ret", c.ctx.retour);
  bind("b-acc", showHome);
}
function findSrc(q) {
  var t = toutesLecons(), i, e, k;
  for (i = 0; i < t.length; i++) { for (e = 0; e < t[i].l.exos.length; e++) { for (k = 0; k < t[i].l.exos[e].qs.length; k++) { if (t[i].l.exos[e].qs[k].q === q.q) { return t[i].l.exos[e].qs[k]; } } } }
  return null;
}

/* ---------- Progression ---------- */
function statsLecon(lid) {
  var st = state.stats[lid];
  if (!st || !st.n) { return null; }
  return { n: st.n, ok: st.n - st.w, p: (st.n - st.w) / st.n };
}
function bilanTexte() {
  var t = "Bilan de Mike (CP) - " + dateLongue() + "\n\n";
  var ls = toutesLecons(), i;
  for (i = 0; i < ls.length; i++) {
    var s = statsLecon(ls[i].l.id);
    t += ls[i].l.titre + " : " + (s ? Math.round(s.p * 100) + " % de réussite (" + s.ok + " bonnes réponses sur " + s.n + ")" : "pas encore travaillée") + "\n";
  }
  t += "\nQuiz du jour : " + state.quiz.total + " fait(s), " + state.quiz.streak + " jour(s) de suite\n\nDernières séances :\n";
  var h = state.history.slice(-8);
  for (i = h.length - 1; i >= 0; i--) { t += "- " + h[i].d + " · " + h[i].g + " : " + h[i].ok + "/" + h[i].n + "\n"; }
  return t;
}
function showProgression() {
  var h = '<div class="carte"><h2>📈 Ma progression</h2>', ls = toutesLecons(), i;
  for (i = 0; i < ls.length; i++) {
    var s = statsLecon(ls[i].l.id);
    h += '<div class="rang"><b>' + ls[i].l.emoji + ' ' + esc(ls[i].l.titre) + '</b><br>';
    h += s ? ('<span class="petit">' + Math.round(s.p * 100) + ' % de bonnes réponses · ' + s.n + ' questions</span>' + barre(s.p)) : '<span class="petit">Pas encore travaillée</span>';
    h += '</div>';
  }
  h += '<p><b>🔥 Quiz du jour :</b> ' + state.quiz.total + ' fait' + (state.quiz.total > 1 ? "s" : "") + ', ' + state.quiz.streak + ' jour' + (state.quiz.streak > 1 ? "s" : "") + ' de suite</p>';
  h += '<button class="bouton" id="b-bilan">Voir le bilan pour maman</button>';
  h += '<button class="bouton second" id="b-ret">Retour</button>';
  h += '<button class="bouton second" id="b-reset">Tout effacer et recommencer</button><div id="reset-zone"></div></div>';
  go(h);
  bind("b-bilan", showBilan);
  bind("b-ret", showHome);
  bind("b-reset", function () {
    document.getElementById("reset-zone").innerHTML = '<div class="retour ko"><p>Tout sera effacé : scores et séries de jours. C\'est définitif.</p><button class="bouton" id="b-ok" style="background:#c0392b;border-color:#8e281d">Oui, tout effacer</button><button class="bouton second" id="b-non">Non, garder</button></div>';
    bind("b-ok", function () { state = defaultState(); saveState(); showHome(); });
    bind("b-non", function () { document.getElementById("reset-zone").innerHTML = ""; });
  });
}
function showBilan() {
  var h = '<div class="carte"><h2>Bilan pour maman</h2><textarea class="bilan" id="bilan" readonly aria-label="Bilan à copier"></textarea>';
  h += '<button class="bouton" id="b-copy">Copier le bilan</button><p class="petit" id="copie-msg"></p>';
  h += '<button class="bouton second" id="b-ret">Retour</button></div>';
  go(h);
  var ta = document.getElementById("bilan"); ta.value = bilanTexte();
  bind("b-copy", function () {
    var msg = document.getElementById("copie-msg");
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, 99999); } catch (e) {}
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    if (!ok) { try { navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {} }
    msg.textContent = ok ? "Bilan copié." : "Copie impossible ici : touche le texte, sélectionne tout et copie.";
  });
  bind("b-ret", showProgression);
}

showHome();
demarreSync();
</script>
